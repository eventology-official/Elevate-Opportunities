<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص البطاقات - Elevate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: #0f172a;
            color: #fff;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #60a5fa;
            margin-bottom: 20px;
            font-size: 2rem;
        }
        .btn {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            font-weight: bold;
        }
        .btn:hover {
            background: #2563eb;
        }
        .btn-danger {
            background: #ef4444;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-success {
            background: #10b981;
        }
        .btn-success:hover {
            background: #059669;
        }
        .result {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            border: 2px solid #334155;
        }
        .result h3 {
            color: #60a5fa;
            margin-bottom: 10px;
        }
        pre {
            background: #000;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.4;
        }
        .card-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin: 20px 0;
        }
        .card-item {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 16px;
        }
        .card-item h4 {
            color: #60a5fa;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        .card-item p {
            color: #94a3b8;
            font-size: 14px;
            margin: 4px 0;
        }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            margin: 4px 0;
        }
        .status-visible {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
        }
        .status-hidden {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }
        .alert {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            color: #fca5a5;
            padding: 16px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .success {
            background: rgba(16, 185, 129, 0.2);
            border: 2px solid #10b981;
            color: #6ee7b7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 فحص بيانات البطاقات - Elevate Opportunities</h1>
        
        <div style="margin-bottom: 20px;">
            <button class="btn" onclick="checkCards()">📊 فحص البطاقات</button>
            <button class="btn btn-success" onclick="addTestCards()">➕ إضافة 5 بطاقات تجريبية</button>
            <button class="btn btn-danger" onclick="clearCards()">🗑️ مسح كل البطاقات</button>
            <button class="btn" onclick="location.href='index.html'">🏠 العودة للموقع</button>
        </div>
        
        <div id="results"></div>
    </div>
    
    <script>
        function checkCards() {
            const resultsDiv = document.getElementById('results');
            const cardsData = localStorage.getItem('luxen_general_cards');
            
            if (!cardsData) {
                resultsDiv.innerHTML = `
                    <div class="alert">
                        <h3>❌ لا توجد بطاقات في localStorage</h3>
                        <p>المفتاح 'luxen_general_cards' غير موجود!</p>
                        <p><strong>الحل:</strong> اضغط على "إضافة 5 بطاقات تجريبية" لإنشاء بيانات تجريبية.</p>
                    </div>
                `;
                return;
            }
            
            try {
                const cards = JSON.parse(cardsData);
                
                if (!Array.isArray(cards)) {
                    resultsDiv.innerHTML = `
                        <div class="alert">
                            <h3>⚠️ البيانات تالفة</h3>
                            <p>البيانات ليست array صحيح!</p>
                        </div>
                    `;
                    return;
                }
                
                if (cards.length === 0) {
                    resultsDiv.innerHTML = `
                        <div class="alert">
                            <h3>⚠️ لا توجد بطاقات</h3>
                            <p>المصفوفة فارغة - لا توجد فرص مضافة!</p>
                            <p><strong>الحل:</strong> اضغط على "إضافة 5 bطاقات تجريبية".</p>
                        </div>
                    `;
                    return;
                }
                
                // تصنيف البطاقات حسب النوع
                const byType = {};
                const byStatus = { visible: 0, hidden: 0, soon: 0 };
                
                cards.forEach(card => {
                    const type = card.type || 'unknown';
                    const status = card.status || 'visible';
                    
                    byType[type] = (byType[type] || 0) + 1;
                    byStatus[status] = (byStatus[status] || 0) + 1;
                });
                
                let html = `
                    <div class="result success">
                        <h3>✅ تم العثور على ${cards.length} فرصة</h3>
                        <p><strong>حسب الحالة:</strong></p>
                        <p>👁️ ظاهرة: ${byStatus.visible} | 🚫 مخفية: ${byStatus.hidden} | ⏳ قريباً: ${byStatus.soon}</p>
                        <p><strong>حسب التصنيف:</strong></p>
                        <p>${Object.entries(byType).map(([type, count]) => `${type}: ${count}`).join(' | ')}</p>
                    </div>
                    
                    <div class="result">
                        <h3>📋 البيانات الكاملة (JSON)</h3>
                        <pre>${JSON.stringify(cards, null, 2)}</pre>
                    </div>
                    
                    <div class="result">
                        <h3>🎴 معاينة البطاقات</h3>
                        <div class="card-preview">
                `;
                
                cards.slice(0, 20).forEach((card, index) => {
                    const statusClass = card.status === 'visible' ? 'status-visible' : 'status-hidden';
                    html += `
                        <div class="card-item">
                            <h4>${card.name || 'بدون عنوان'}</h4>
                            <p><strong>التصنيف:</strong> ${card.type || 'غير محدد'}</p>
                            <p><strong>الجهة:</strong> ${card.category || 'غير محدد'}</p>
                            <p><strong>الموعد:</strong> ${card.deadline || 'غير محدد'}</p>
                            <p><span class="status ${statusClass}">${card.status || 'visible'}</span></p>
                            <p style="font-size: 12px; color: #64748b; margin-top: 8px;">ID: ${card.id || index}</p>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                    </div>
                `;
                
                resultsDiv.innerHTML = html;
                
            } catch (e) {
                resultsDiv.innerHTML = `
                    <div class="alert">
                        <h3>❌ خطأ في قراءة البيانات</h3>
                        <p><strong>الخطأ:</strong> ${e.message}</p>
                        <pre>${cardsData.substring(0, 500)}...</pre>
                    </div>
                `;
            }
        }
        
        function addTestCards() {
            const testCards = [
                {
                    id: 'test_comp_' + Date.now(),
                    numId: Date.now(),
                    name: 'مسابقة البرمجة العالمية 2024',
                    type: 'competitions',
                    category: 'Google',
                    tags: 'برمجة تقنية مسابقة',
                    description: 'مسابقة برمجية عالمية مع جوائز قيمة للفائزين',
                    shortDesc: 'مسابقة برمجية عالمية',
                    deadline: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                    status: 'visible',
                    link: 'https://example.com',
                    createdAt: Date.now(),
                    isFeatured: true
                },
                {
                    id: 'test_schol_' + Date.now(),
                    numId: Date.now() + 1,
                    name: 'منحة دراسية كاملة - جامعة هارفارد',
                    type: 'scholarships',
                    category: 'Harvard University',
                    tags: 'منحة دراسة جامعة',
                    description: 'منحة دراسية كاملة التمويل للطلاب المتفوقين',
                    shortDesc: 'منحة هارفارد الكاملة',
                    deadline: new Date(Date.now() + 60 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                    status: 'visible',
                    link: 'https://example.com',
                    createdAt: Date.now()
                },
                {
                    id: 'test_vol_' + Date.now(),
                    numId: Date.now() + 2,
                    name: 'فرصة تطوع مع الصليب الأحمر',
                    type: 'volunteering',
                    category: 'Red Cross',
                    tags: 'تطوع إنساني مساعدة',
                    description: 'فرصة تطوع للمساعدة في الأعمال الإنسانية',
                    shortDesc: 'تطوع مع الصليب الأحمر',
                    deadline: new Date(Date.now() + 15 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                    status: 'visible',
                    link: 'https://example.com',
                    createdAt: Date.now()
                },
                {
                    id: 'test_job_' + Date.now(),
                    numId: Date.now() + 3,
                    name: 'وظيفة مطور Full Stack - شركة Microsoft',
                    type: 'jobs',
                    category: 'Microsoft',
                    tags: 'وظيفة برمجة تطوير',
                    description: 'فرصة عمل كمطور Full Stack في شركة عالمية',
                    shortDesc: 'مطور Full Stack',
                    deadline: new Date(Date.now() + 45 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                    status: 'visible',
                    link: 'https://example.com',
                    createdAt: Date.now()
                },
                {
                    id: 'test_event_' + Date.now(),
                    numId: Date.now() + 4,
                    name: 'مؤتمر التكنولوجيا والابتكار 2024',
                    type: 'events',
                    category: 'TechCon',
                    tags: 'مؤتمر تقنية ابتكار',
                    description: 'مؤتمر سنوي يجمع خبراء التكنولوجيا من العالم',
                    shortDesc: 'مؤتمر التكنولوجيا',
                    deadline: new Date(Date.now() + 20 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                    status: 'visible',
                    link: 'https://example.com',
                    createdAt: Date.now()
                }
            ];
            
            // دمج البطاقات الجديدة مع الموجودة
            let existing = [];
            try {
                const data = localStorage.getItem('luxen_general_cards');
                if (data) {
                    existing = JSON.parse(data);
                    if (!Array.isArray(existing)) existing = [];
                }
            } catch (e) {
                existing = [];
            }
            
            const merged = [...existing, ...testCards];
            localStorage.setItem('luxen_general_cards', JSON.stringify(merged));
            
            alert('✅ تم إضافة 5 بطاقات تجريبية بنجاح!\n\nارجع للموقع الرئيسي وافتح أي category لرؤية البطاقات.');
            checkCards();
        }
        
        function clearCards() {
            if (confirm('⚠️ هل أنت متأكد من حذف جميع البطاقات؟\n\nهذا الإجراء لا يمكن التراجع عنه!')) {
                localStorage.removeItem('luxen_general_cards');
                alert('🗑️ تم حذف جميع البطاقات!');
                document.getElementById('results').innerHTML = '';
                checkCards();
            }
        }
        
        // Auto check on load
        window.onload = checkCards;
    </script>
</body>
</html>
