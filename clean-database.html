<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗑️ إدارة وتنظيف قاعدة البيانات السحابية - Elevate</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }
        .container {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            color: #fff;
            margin-bottom: 8px;
            font-size: 2rem;
            text-align: center;
            font-weight: 800;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }
        .warning {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 18px 20px;
            border-radius: 14px;
            margin-bottom: 24px;
            font-size: 0.92rem;
            line-height: 1.6;
        }
        .warning h3 {
            color: #ef4444;
            margin-bottom: 6px;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 24px 0;
        }
        .btn {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #fff;
            border: none;
            padding: 16px 24px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
        }
        .btn-danger:hover {
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.35);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
        }
        .btn-success:hover {
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }
        .status-box {
            background: rgba(30, 41, 59, 0.6);
            padding: 20px;
            border-radius: 14px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .status-box h3 {
            color: #60a5fa;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }
        .stat-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin: 4px;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗑️ إدارة وتنظيف قاعدة البيانات</h1>
        <p class="subtitle">Elevate Enterprise Cloud Database — Supabase PostgreSQL</p>
        
        <div class="warning">
            <h3><i class="fas fa-triangle-exclamation"></i> تنبيه هام</h3>
            <p>عمليات الحذف تقوم بتصفير ومسح السجلات نهائياً من قاعدة البيانات السحابية (PostgreSQL) والتخزين المحلي. يتم الاحتفاظ بحساب المدير العام فقط لضمان إمكانية الدخول.</p>
        </div>
        
        <div id="status"></div>
        
        <div class="btn-group">
            <button class="btn btn-success" onclick="verifyDatabase()">
                <i class="fas fa-magnifying-glass-chart"></i>
                <span>فحص وتدقيق حالة قاعدة البيانات السحابية</span>
            </button>
            
            <button class="btn btn-danger" onclick="cleanAllCloudAndLocal()">
                <i class="fas fa-broom"></i>
                <span>💣 تصفير ومسح شامل لقاعدة البيانات (Supabase + محلي)</span>
            </button>

            <button class="btn btn-secondary" onclick="cleanLocalOnly()">
                <i class="fas fa-trash-can"></i>
                <span>مسح الذاكرة المحلية للمتصفح فقط (localStorage)</span>
            </button>
            
            <button class="btn btn-secondary" onclick="location.href='index.html'">
                <i class="fas fa-arrow-right"></i>
                <span>العودة للصفحة الرئيسية للموقع</span>
            </button>
        </div>
    </div>
    
    <script>
        const statusDiv = document.getElementById('status');
        const SUPABASE_URL = 'https://uhjstvlhlkcewmquhrnj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoanN0dmxobGtjZXdtcXVocm5qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzNzU3MDUsImV4cCI6MjExMDk1MTcwNX0.XpTZ-mxoY89WDcQ4dYzubev65hcxFOJ67iK7ikoVNuA';
        
        const HEADERS = {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json'
        };

        function showLoading(msg) {
            statusDiv.innerHTML = `
                <div class="status-box" style="text-align: center;">
                    <div class="spinner"></div>
                    <p style="color: #94a3b8;">${msg}</p>
                </div>
            `;
        }

        // 1. فحص قاعدة البيانات السحابية
        async function verifyDatabase() {
            showLoading('جاري فحص حالة قاعدة البيانات السحابية...');
            try {
                const [oppsRes, crsRes, prtRes, msgRes, usrRes] = await Promise.all([
                    fetch(`${SUPABASE_URL}/rest/v1/opportunities?select=id`, { headers: HEADERS }),
                    fetch(`${SUPABASE_URL}/rest/v1/courses?select=id`, { headers: HEADERS }),
                    fetch(`${SUPABASE_URL}/rest/v1/partners?select=id`, { headers: HEADERS }),
                    fetch(`${SUPABASE_URL}/rest/v1/community_messages?select=id`, { headers: HEADERS }),
                    fetch(`${SUPABASE_URL}/rest/v1/users?select=id,username,is_admin`, { headers: HEADERS })
                ]);

                const opps = await oppsRes.json();
                const courses = await crsRes.json();
                const partners = await prtRes.json();
                const messages = await msgRes.json();
                const users = await usrRes.json();

                statusDiv.innerHTML = `
                    <div class="status-box" style="border-color: rgba(16, 185, 129, 0.4);">
                        <h3 style="color: #10b981;"><i class="fas fa-circle-check"></i> تقرير قاعدة البيانات السحابية (Supabase PostgreSQL)</h3>
                        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;">
                            <span class="stat-badge"><i class="fas fa-graduation-cap"></i> الفرص: <strong>${Array.isArray(opps) ? opps.length : 0}</strong></span>
                            <span class="stat-badge"><i class="fas fa-book-open"></i> الكورسات: <strong>${Array.isArray(courses) ? courses.length : 0}</strong></span>
                            <span class="stat-badge"><i class="fas fa-handshake"></i> الشركاء: <strong>${Array.isArray(partners) ? partners.length : 0}</strong></span>
                            <span class="stat-badge"><i class="fas fa-comments"></i> رسائل المجتمع: <strong>${Array.isArray(messages) ? messages.length : 0}</strong></span>
                            <span class="stat-badge"><i class="fas fa-users"></i> المستخدمين: <strong>${Array.isArray(users) ? users.length : 0}</strong> (مدير: 1)</span>
                        </div>
                        <p style="margin-top: 14px; font-size: 0.88rem; color: #cbd5e1;">✔ الاتصال بالسحابة سليم تماماً وبدون أي أخطاء.</p>
                    </div>
                `;
            } catch (err) {
                statusDiv.innerHTML = `
                    <div class="status-box" style="border-color: #ef4444;">
                        <h3 style="color: #ef4444;"><i class="fas fa-circle-xmark"></i> خطأ أثناء الفحص</h3>
                        <p>${err.message}</p>
                    </div>
                `;
            }
        }

        // 2. مسح شامل
        async function cleanAllCloudAndLocal() {
            if (!confirm('⚠️ تحذير نهائي:\nهل أنت متأكد من تصفير كافة الفرص والبيانات والإحصائيات من السحابة والمتصفح؟\nسيتم الاحتفاظ بحساب المدير فقط.')) {
                return;
            }

            showLoading('جاري تصفير قاعدة بيانات Supabase والتخزين المحلي...');

            try {
                // Clear opportunities
                await fetch(`${SUPABASE_URL}/rest/v1/opportunities?id=neq.none`, { method: 'DELETE', headers: HEADERS });
                // Clear courses
                await fetch(`${SUPABASE_URL}/rest/v1/courses?id=neq.none`, { method: 'DELETE', headers: HEADERS });
                // Clear partners
                await fetch(`${SUPABASE_URL}/rest/v1/partners?id=neq.none`, { method: 'DELETE', headers: HEADERS });
                // Clear community messages
                await fetch(`${SUPABASE_URL}/rest/v1/community_messages?id=neq.none`, { method: 'DELETE', headers: HEADERS });
                // Clear test users (keep admin)
                await fetch(`${SUPABASE_URL}/rest/v1/users?id=neq.admin_master_001`, { method: 'DELETE', headers: HEADERS });

                // Reset site_store keys
                const resetKeys = {
                    luxen_general_cards: [],
                    luxen_partners: [],
                    luxen_courses: [],
                    luxen_comments: [],
                    luxen_course_comments: {},
                    luxen_community_messages: [],
                    luxen_submissions: [],
                    luxen_notifications: [],
                    luxen_likes: {},
                    luxen_views: {},
                    luxen_votes: {},
                    luxen_course_likes: {},
                    luxen_course_bookmarks: {},
                    luxen_course_subscriptions: [],
                    luxen_video_likes: {},
                    luxen_video_views: {},
                    luxen_live_joins: {},
                    luxen_reset_requests: [],
                    luxen_suggested_opportunities: [],
                    luxen_deleted_teachers: [],
                    luxen_user_follows: {},
                    luxen_app_installs: [],
                    luxen_category_status: {},
                    luxen_settings: {},
                    luxen_lockdown_status: { isLocked: false }
                };

                for (const [key, val] of Object.entries(resetKeys)) {
                    await fetch(`${SUPABASE_URL}/rest/v1/site_store`, {
                        method: 'POST',
                        headers: { ...HEADERS, 'Prefer': 'resolution=merge-duplicates' },
                        body: JSON.stringify({ key, value: val, updated_at: new Date().toISOString() })
                    });
                }

                // Clear localStorage
                const localKeys = [
                    'luxen_general_cards', 'luxen_partners', 'luxen_courses', 'luxen_comments',
                    'luxen_notifications', 'luxen_submissions', 'luxen_votes', 'luxen_settings',
                    'luxen_category_status', 'luxen_community_messages', 'luxen_course_comments',
                    'luxen_faq', 'luxen_likes', 'luxen_views', 'luxen_video_likes', 'luxen_video_views',
                    'luxen_app_installs', 'luxen_live_joins'
                ];
                localKeys.forEach(k => localStorage.removeItem(k));

                statusDiv.innerHTML = `
                    <div class="status-box" style="border-color: #10b981;">
                        <h3 style="color: #10b981;"><i class="fas fa-circle-check"></i> اكتملت عملية التصفير السحابي بنجاح!</h3>
                        <p>تم تصفير جميع الجداول السحابية (opportunities, courses, partners, messages) وتصفير الذاكرة المحلية بالكامل.</p>
                        <p style="margin-top: 8px; color: #38bdf8;">🎉 قاعدة البيانات الآن نظيفة تماماً 100% وجاهزة لاستقبال البيانات الجديدة.</p>
                    </div>
                `;
            } catch (err) {
                statusDiv.innerHTML = `
                    <div class="status-box" style="border-color: #ef4444;">
                        <h3 style="color: #ef4444;"><i class="fas fa-circle-xmark"></i> خطأ أثناء العملية</h3>
                        <p>${err.message}</p>
                    </div>
                `;
            }
        }

        // 3. مسح محلي فقط
        function cleanLocalOnly() {
            Object.keys(localStorage).forEach(k => {
                if (k.startsWith('luxen_')) localStorage.removeItem(k);
            });
            statusDiv.innerHTML = `
                <div class="status-box" style="border-color: #38bdf8;">
                    <h3 style="color: #38bdf8;"><i class="fas fa-circle-check"></i> تم تنظيف الذاكرة المحلية</h3>
                    <p>تم مسح مفاتيح المتصفح بنجاح. سيتم جلب أحدث البيانات من السحابة عند التحديث.</p>
                </div>
            `;
        }

        // Automatic verify on load
        window.addEventListener('DOMContentLoaded', verifyDatabase);
    </script>
</body>
</html>
