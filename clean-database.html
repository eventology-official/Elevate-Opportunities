<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗑️ تنظيف قاعدة البيانات - Elevate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 2rem;
            text-align: center;
        }
        .warning {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            color: #fca5a5;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: center;
        }
        .warning h3 {
            color: #ef4444;
            margin-bottom: 10px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 16px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        .btn-danger:hover {
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        .status {
            background: rgba(30, 41, 59, 0.6);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status h3 {
            color: #60a5fa;
            margin-bottom: 10px;
        }
        .status p {
            color: rgba(255, 255, 255, 0.8);
            margin: 8px 0;
            line-height: 1.6;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.7);
        }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .checklist {
            background: rgba(30, 41, 59, 0.6);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
        }
        .checklist-item.done {
            background: rgba(16, 185, 129, 0.2);
        }
        .checklist-item i {
            font-size: 20px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
    <div class="container">
        <h1>🗑️ تنظيف قاعدة البيانات</h1>
        
        <div class="warning">
            <h3>⚠️ تحذير مهم</h3>
            <p>هذه العملية ستحذف <strong>جميع البيانات</strong> من:</p>
            <p>✗ localStorage المحلي</p>
            <p>✗ قاعدة بيانات Supabase السحابية</p>
            <p><strong>لا يمكن التراجع عن هذه العملية!</strong></p>
        </div>
        
        <div id="status"></div>
        
        <div class="btn-group">
            <button class="btn btn-danger" onclick="confirmClean()">
                <i class="fas fa-trash-alt"></i>
                <span>🗑️ مسح كل البيانات (localStorage فقط)</span>
            </button>
            
            <button class="btn btn-danger" onclick="cleanSupabase()">
                <i class="fas fa-database"></i>
                <span>☁️ مسح قاعدة بيانات Supabase</span>
            </button>
            
            <button class="btn btn-danger" onclick="cleanEverything()">
                <i class="fas fa-bomb"></i>
                <span>💣 مسح كل شيء (localStorage + Supabase)</span>
            </button>
            
            <button class="btn btn-success" onclick="verifyClean()">
                <i class="fas fa-check-circle"></i>
                <span>✅ التحقق من النظافة</span>
            </button>
            
            <button class="btn" onclick="location.href='index.html'">
                <i class="fas fa-home"></i>
                <span>🏠 العودة للموقع</span>
            </button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const statusDiv = document.getElementById('status');
        
        const SUPABASE_URL = 'https://uhjstvlhlkcewmquhrnj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoanN0dmxobGtjZXdtcXVocm5qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzNzU3MDUsImV4cCI6MjExMDk1MTcwNX0.XpTZ-mxoY89WDcQ4dYzubev65hcxFOJ67iK7ikoVNuA';
        
        function showStatus(html) {
            statusDiv.innerHTML = html;
        }
        
        function showLoading(message) {
            statusDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 15px;">${message}</p>
                </div>
            `;
        }
        
        // 1. Clean localStorage only
        function confirmClean() {
            if (!confirm('⚠️ هل أنت متأكد من مسح جميع البيانات المحلية؟\n\nهذا سيحذف:\n- الفرص\n- الشركاء\n- المستخدمين\n- الإعدادات\n\nلن يتم حذف بيانات Supabase.')) {
                return;
            }
            
            showLoading('جاري مسح localStorage...');
            
            setTimeout(() => {
                const keysToDelete = [
                    'luxen_general_cards',
                    'luxen_partners',
                    'luxen_all_users',
                    'luxen_courses',
                    'luxen_comments',
                    'luxen_notifications',
                    'luxen_submissions',
                    'luxen_votes',
                    'luxen_settings',
                    'luxen_category_status',
                    'luxen_community_messages',
                    'luxen_course_comments',
                    'luxen_faq',
                    'luxen_likes',
                    'luxen_views'
                ];
                
                let deleted = 0;
                keysToDelete.forEach(key => {
                    if (localStorage.getItem(key)) {
                        localStorage.removeItem(key);
                        deleted++;
                    }
                });
                
                showStatus(`
                    <div class="status" style="background: rgba(16, 185, 129, 0.2); border: 2px solid #10b981;">
                        <h3 style="color: #10b981;">✅ تم المسح بنجاح!</h3>
                        <p>تم حذف ${deleted} مفتاح من localStorage</p>
                        <p><strong>قاعدة البيانات المحلية الآن نظيفة تماماً!</strong></p>
                        <p style="margin-top: 15px; color: #fbbf24;">⚠️ ملاحظة: بيانات Supabase لم يتم حذفها.</p>
                    </div>
                `);
            }, 1000);
        }
        
        // 2. Clean Supabase
        async function cleanSupabase() {
            if (!confirm('🚨 تحذير خطير!\n\nهذا سيحذف جميع البيانات من قاعدة بيانات Supabase السحابية!\n\nهل أنت متأكد 100%؟')) {
                return;
            }
            
            if (!confirm('⚠️ تأكيد نهائي!\n\nلن تستطيع استرجاع البيانات بعد هذه العملية!\n\nاضغط OK للمتابعة أو Cancel للإلغاء.')) {
                return;
            }
            
            showLoading('جاري الاتصال بـ Supabase...');
            
            try {
                const headers = {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                };
                
                // Delete all from site_store
                showLoading('جاري حذف البيانات من site_store...');
                await fetch(SUPABASE_URL + '/rest/v1/site_store?id=gt.0', {
                    method: 'DELETE',
                    headers: headers
                });
                
                showStatus(`
                    <div class="status" style="background: rgba(16, 185, 129, 0.2); border: 2px solid #10b981;">
                        <h3 style="color: #10b981;">✅ تم المسح من Supabase!</h3>
                        <p>تم حذف جميع البيانات من قاعدة البيانات السحابية</p>
                        <p><strong>Supabase الآن نظيف تماماً!</strong></p>
                    </div>
                `);
                
            } catch (error) {
                showStatus(`
                    <div class="status" style="background: rgba(239, 68, 68, 0.2); border: 2px solid #ef4444;">
                        <h3 style="color: #ef4444;">❌ فشل الحذف</h3>
                        <p><strong>الخطأ:</strong> ${error.message}</p>
                        <p>تحقق من الصلاحيات أو اتصال الإنترنت.</p>
                    </div>
                `);
            }
        }
        
        // 3. Clean Everything
        async function cleanEverything() {
            if (!confirm('💣 تحذير: عملية حذف شاملة!\n\nهذا سيحذف:\n✗ جميع البيانات المحلية (localStorage)\n✗ جميع بيانات Supabase السحابية\n\nهل أنت متأكد؟')) {
                return;
            }
            
            if (!confirm('⚠️ تأكيد أخير!\n\nلن يمكنك استرجاع أي بيانات بعد هذه العملية!\n\nاضغط OK للمسح الكامل أو Cancel للإلغاء.')) {
                return;
            }
            
            showLoading('جاري المسح الشامل...');
            
            // 1. Clean localStorage
            const keysToDelete = [
                'luxen_general_cards', 'luxen_partners', 'luxen_all_users',
                'luxen_courses', 'luxen_comments', 'luxen_notifications',
                'luxen_submissions', 'luxen_votes', 'luxen_settings',
                'luxen_category_status', 'luxen_community_messages',
                'luxen_course_comments', 'luxen_faq', 'luxen_likes', 'luxen_views'
            ];
            
            keysToDelete.forEach(key => localStorage.removeItem(key));
            
            // 2. Clean Supabase
            try {
                const headers = {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                };
                
                showLoading('جاري حذف البيانات من Supabase...');
                await fetch(SUPABASE_URL + '/rest/v1/site_store?id=gt.0', {
                    method: 'DELETE',
                    headers: headers
                });
                
                showStatus(`
                    <div class="status" style="background: rgba(16, 185, 129, 0.2); border: 2px solid #10b981;">
                        <h3 style="color: #10b981;">✅ تم المسح الكامل بنجاح!</h3>
                        <div class="checklist">
                            <div class="checklist-item done">
                                <i class="fas fa-check-circle" style="color: #10b981;"></i>
                                <span>localStorage تم مسحه بالكامل</span>
                            </div>
                            <div class="checklist-item done">
                                <i class="fas fa-check-circle" style="color: #10b981;"></i>
                                <span>Supabase تم مسحه بالكامل</span>
                            </div>
                            <div class="checklist-item done">
                                <i class="fas fa-check-circle" style="color: #10b981;"></i>
                                <span>النظام جاهز للبدء من جديد</span>
                            </div>
                        </div>
                        <p style="margin-top: 15px;"><strong>🎉 النظام الآن نظيف 100% وجاهز لاستقبال البيانات الجديدة!</strong></p>
                    </div>
                `);
                
            } catch (error) {
                showStatus(`
                    <div class="status" style="background: rgba(239, 68, 68, 0.2); border: 2px solid #ef4444;">
                        <h3 style="color: #ef4444;">⚠️ مسح جزئي</h3>
                        <p>✅ localStorage تم مسحه بنجاح</p>
                        <p>❌ Supabase: ${error.message}</p>
                    </div>
                `);
            }
        }
        
        // 4. Verify Clean
        function verifyClean() {
            showLoading('جاري الفحص...');
            
            setTimeout(() => {
                const keys = [
                    'luxen_general_cards',
                    'luxen_partners',
                    'luxen_all_users',
                    'luxen_courses'
                ];
                
                const results = keys.map(key => {
                    const data = localStorage.getItem(key);
                    let count = 0;
                    
                    if (data) {
                        try {
                            const parsed = JSON.parse(data);
                            count = Array.isArray(parsed) ? parsed.length : 0;
                        } catch (e) {}
                    }
                    
                    return { key, count, clean: count === 0 };
                });
                
                const allClean = results.every(r => r.clean);
                
                const checklistHtml = results.map(r => `
                    <div class="checklist-item ${r.clean ? 'done' : ''}">
                        <i class="fas ${r.clean ? 'fa-check-circle' : 'fa-exclamation-triangle'}" 
                           style="color: ${r.clean ? '#10b981' : '#f59e0b'};"></i>
                        <span>${r.key}: ${r.count} عنصر</span>
                    </div>
                `).join('');
                
                showStatus(`
                    <div class="status" style="background: rgba(${allClean ? '16, 185, 129' : '245, 158, 11'}, 0.2); border: 2px solid ${allClean ? '#10b981' : '#f59e0b'};">
                        <h3 style="color: ${allClean ? '#10b981' : '#f59e0b'};">
                            ${allClean ? '✅ النظام نظيف!' : '⚠️ توجد بيانات'}
                        </h3>
                        <div class="checklist">
                            ${checklistHtml}
                        </div>
                        <p style="margin-top: 15px;">
                            ${allClean 
                                ? '<strong>🎉 localStorage نظيف تماماً وجاهز!</strong>' 
                                : '<strong>اضغط "مسح كل البيانات" للتنظيف</strong>'}
                        </p>
                    </div>
                `);
            }, 1000);
        }
        
        // Auto verify on load
        window.onload = verifyClean;
    </script>
</body>
</html>
