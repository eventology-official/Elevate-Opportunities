<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إحصائيات البيانات - Elevate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: #fff;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-number {
            font-size: 3.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .stat-label {
            font-size: 1.1rem;
            color: #64748b;
            font-weight: 600;
        }
        .stat-emoji {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .data-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .data-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .data-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .data-item-label {
            font-weight: 600;
        }
        .data-item-value {
            font-size: 1.3rem;
            font-weight: bold;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .btn {
            background: rgba(255, 255, 255, 0.95);
            color: #667eea;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.6;
            max-height: 500px;
            overflow-y: auto;
        }
        .alert {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid #ef4444;
            color: #dc2626;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: center;
        }
        .success-msg {
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid #10b981;
            color: #059669;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5rem;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 إحصائيات بيانات Elevate Opportunities</h1>
        
        <div class="btn-group">
            <button class="btn" onclick="loadStats()">🔄 تحديث البيانات</button>
            <button class="btn btn-success" onclick="location.href='check-cards.html'">🔍 فحص تفصيلي</button>
            <button class="btn btn-danger" onclick="location.href='clean-database.html'">🧹 تنظيف البيانات</button>
            <button class="btn" onclick="location.href='index.html'">🏠 الصفحة الرئيسية</button>
        </div>
        
        <div id="loading" class="loading">⏳ جاري تحميل البيانات...</div>
        <div id="content" style="display: none;"></div>
    </div>
    
    <script>
        function loadStats() {
            const loadingDiv = document.getElementById('loading');
            const contentDiv = document.getElementById('content');
            
            loadingDiv.style.display = 'block';
            contentDiv.style.display = 'none';
            
            setTimeout(() => {
                try {
                    // جمع كل البيانات من localStorage
                    const data = {
                        opportunities: JSON.parse(localStorage.getItem('luxen_general_cards') || '[]'),
                        users: JSON.parse(localStorage.getItem('luxen_all_users') || '[]'),
                        partners: JSON.parse(localStorage.getItem('luxen_partners') || '[]'),
                        courses: JSON.parse(localStorage.getItem('luxen_courses') || '[]'),
                        devices: JSON.parse(localStorage.getItem('luxen_admin_devices') || '[]'),
                        currentDevice: localStorage.getItem('elevate_current_device_id') || 'none'
                    };
                    
                    // تصنيف الفرص
                    const oppByType = {};
                    const oppByStatus = { visible: 0, hidden: 0, soon: 0 };
                    
                    data.opportunities.forEach(opp => {
                        const type = opp.type || 'unknown';
                        const status = opp.status || 'visible';
                        oppByType[type] = (oppByType[type] || 0) + 1;
                        oppByStatus[status] = (oppByStatus[status] || 0) + 1;
                    });
                    
                    // تصنيف الشركاء
                    const partnersByStatus = { active: 0, pending: 0, suspended: 0 };
                    data.partners.forEach(p => {
                        const status = p.status || 'active';
                        partnersByStatus[status] = (partnersByStatus[status] || 0) + 1;
                    });
                    
                    // إجمالي حجم البيانات
                    let totalSize = 0;
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        const value = localStorage.getItem(key);
                        totalSize += (key.length + value.length) * 2; // UTF-16 = 2 bytes per char
                    }
                    const totalSizeKB = (totalSize / 1024).toFixed(2);
                    
                    let html = `
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-emoji">🎯</div>
                                <div class="stat-number">${data.opportunities.length}</div>
                                <div class="stat-label">إجمالي الفرص</div>
                            </div>
                            
                            <div class="stat-card">
                                <div class="stat-emoji">👥</div>
                                <div class="stat-number">${data.users.length}</div>
                                <div class="stat-label">المستخدمين</div>
                            </div>
                            
                            <div class="stat-card">
                                <div class="stat-emoji">🤝</div>
                                <div class="stat-number">${data.partners.length}</div>
                                <div class="stat-label">الشركاء</div>
                            </div>
                            
                            <div class="stat-card">
                                <div class="stat-emoji">📚</div>
                                <div class="stat-number">${data.courses.length}</div>
                                <div class="stat-label">الكورسات</div>
                            </div>
                            
                            <div class="stat-card">
                                <div class="stat-emoji">💾</div>
                                <div class="stat-number">${totalSizeKB}</div>
                                <div class="stat-label">KB في localStorage</div>
                            </div>
                            
                            <div class="stat-card">
                                <div class="stat-emoji">📱</div>
                                <div class="stat-number">${data.devices.length}</div>
                                <div class="stat-label">الأجهزة المسجلة</div>
                            </div>
                        </div>
                    `;
                    
                    // تفاصيل الفرص
                    if (data.opportunities.length > 0) {
                        html += `
                            <div class="data-section">
                                <h2>📊 تصنيف الفرص</h2>
                                <div class="data-grid">
                        `;
                        
                        const typeNames = {
                            scholarships: '🎓 المنح الدراسية',
                            competitions: '🏆 المسابقات',
                            volunteering: '🤲 التطوع',
                            jobs: '💼 الوظائف',
                            events: '📅 الفعاليات',
                            training: '📚 التدريب',
                            internships: '🏢 التدريب العملي'
                        };
                        
                        for (const [type, count] of Object.entries(oppByType)) {
                            const name = typeNames[type] || `❓ ${type}`;
                            html += `
                                <div class="data-item">
                                    <span class="data-item-label">${name}</span>
                                    <span class="data-item-value">${count}</span>
                                </div>
                            `;
                        }
                        
                        html += `
                                </div>
                                <div style="margin-top: 20px;">
                                    <h3 style="color: #64748b; margin-bottom: 10px;">حالة الفرص:</h3>
                                    <div class="data-grid">
                                        <div class="data-item">
                                            <span class="data-item-label">👁️ ظاهرة</span>
                                            <span class="data-item-value">${oppByStatus.visible}</span>
                                        </div>
                                        <div class="data-item">
                                            <span class="data-item-label">🚫 مخفية</span>
                                            <span class="data-item-value">${oppByStatus.hidden}</span>
                                        </div>
                                        <div class="data-item">
                                            <span class="data-item-label">⏳ قريباً</span>
                                            <span class="data-item-value">${oppByStatus.soon || 0}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="alert">
                                ⚠️ لا توجد فرص مضافة حالياً!
                                <br><br>
                                <a href="check-cards.html" style="color: #ef4444; text-decoration: underline; font-weight: bold;">
                                    اضغط هنا لإضافة بيانات تجريبية
                                </a>
                            </div>
                        `;
                    }
                    
                    // تفاصيل الشركاء
                    if (data.partners.length > 0) {
                        html += `
                            <div class="data-section">
                                <h2>🤝 الشركاء</h2>
                                <div class="data-grid">
                                    <div class="data-item">
                                        <span class="data-item-label">✅ نشط</span>
                                        <span class="data-item-value">${partnersByStatus.active}</span>
                                    </div>
                                    <div class="data-item">
                                        <span class="data-item-label">⏳ قيد المراجعة</span>
                                        <span class="data-item-value">${partnersByStatus.pending}</span>
                                    </div>
                                    <div class="data-item">
                                        <span class="data-item-label">🚫 معلق</span>
                                        <span class="data-item-value">${partnersByStatus.suspended}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                    
                    // localStorage مفاتيح
                    html += `
                        <div class="data-section">
                            <h2>🔑 مفاتيح localStorage (${localStorage.length})</h2>
                            <div class="data-grid">
                    `;
                    
                    const keys = [];
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        const value = localStorage.getItem(key);
                        const sizeKB = ((key.length + value.length) * 2 / 1024).toFixed(2);
                        keys.push({ key, sizeKB });
                    }
                    
                    keys.sort((a, b) => parseFloat(b.sizeKB) - parseFloat(a.sizeKB));
                    
                    keys.forEach(item => {
                        html += `
                            <div class="data-item">
                                <span class="data-item-label">${item.key}</span>
                                <span class="data-item-value">${item.sizeKB} KB</span>
                            </div>
                        `;
                    });
                    
                    html += `
                            </div>
                        </div>
                    `;
                    
                    // JSON للبيانات الكاملة (عينة فقط)
                    const sampleData = {
                        opportunities: data.opportunities.slice(0, 3),
                        users: data.users.slice(0, 2),
                        partners: data.partners.slice(0, 2),
                        totalItems: {
                            opportunities: data.opportunities.length,
                            users: data.users.length,
                            partners: data.partners.length,
                            courses: data.courses.length
                        }
                    };
                    
                    html += `
                        <div class="data-section">
                            <h2>📄 عينة من البيانات (JSON)</h2>
                            <p style="color: #64748b; margin-bottom: 15px;">
                                أول 3 فرص + 2 مستخدمين + 2 شركاء
                            </p>
                            <pre>${JSON.stringify(sampleData, null, 2)}</pre>
                        </div>
                    `;
                    
                    contentDiv.innerHTML = html;
                    loadingDiv.style.display = 'none';
                    contentDiv.style.display = 'block';
                    
                } catch (e) {
                    contentDiv.innerHTML = `
                        <div class="alert">
                            ❌ خطأ في تحميل البيانات!
                            <br><br>
                            <strong>الخطأ:</strong> ${e.message}
                        </div>
                    `;
                    loadingDiv.style.display = 'none';
                    contentDiv.style.display = 'block';
                }
            }, 500);
        }
        
        // Auto load on page open
        window.onload = loadStats;
    </script>
</body>
</html>
