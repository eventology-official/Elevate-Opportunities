<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elevate Opportunities — تسجيل الدخول وإنشاء حساب</title>
  <meta name="description" content="سجل دخولك إلى Elevate Opportunities للوصول إلى المسابقات، الدورات، والفرص الحصرية.">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="elevate-boost.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #090d16;
      font-family: 'Cairo', sans-serif;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }
    .login-container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      position: relative;
      z-index: 10;
    }
    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }
    .back-home-link:hover {
      color: #38bdf8;
      transform: translateX(4px);
    }
    .login-auth-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(56, 189, 248, 0.1);
    }
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }
    .logo-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      color: #fff;
      box-shadow: 0 8px 16px rgba(56, 189, 248, 0.3);
    }
    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-badge {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #38bdf8;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .tab-switcher {
      display: flex;
      background: rgba(2, 6, 23, 0.6);
      border-radius: 14px;
      padding: 5px;
      position: relative;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .tab-indicator {
      position: absolute;
      top: 5px;
      right: 5px;
      width: calc(50% - 5px);
      height: calc(100% - 10px);
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      border-radius: 10px;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      position: relative;
      z-index: 2;
      transition: color 0.2s ease;
    }
    .tab-btn.active {
      color: #fff;
    }
    .form-heading {
      margin-bottom: 20px;
    }
    .form-heading h2 {
      font-size: 1.4rem;
      margin: 0 0 6px;
      color: #fff;
    }
    .form-heading p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin: 0;
    }
    .form-content {
      display: none;
    }
    .form-content.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .input-group {
      margin-bottom: 16px;
      text-align: right;
    }
    .input-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-field {
      width: 100%;
      padding: 12px 42px 12px 14px;
      background: rgba(2, 6, 23, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    .input-field:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
      background: rgba(2, 6, 23, 0.8);
    }
    .input-icon-right {
      position: absolute;
      right: 14px;
      color: #64748b;
      font-size: 1rem;
      pointer-events: none;
    }
    .toggle-password {
      position: absolute;
      left: 12px;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
    }
    .toggle-password:hover {
      color: #94a3b8;
    }
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0 20px;
      font-size: 0.85rem;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #cbd5e1;
    }
    .remember-me input {
      accent-color: #38bdf8;
    }
    .forgot-link {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.45);
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 24px 0 18px;
      color: #64748b;
      font-size: 0.85rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .divider span {
      padding: 0 12px;
    }
    .social-btn {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #f1f5f9;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .social-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }
    .alert-box {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 16px;
      text-align: right;
    }
    .alert-box.info {
      display: block;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
    }
    .alert-box.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
    .alert-box.success {
      display: block;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #22c55e;
    }
  </style>
</head>
<body>
  <!-- Ambient background glow -->
  <div class="bg-canvas" style="position: fixed; inset: 0; z-index: 1; pointer-events: none;">
    <div class="glow-orb glow-1" style="position: absolute; top: 10%; right: 15%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(56,189,248,0.15), transparent 70%);"></div>
    <div class="glow-orb glow-2" style="position: absolute; bottom: 10%; left: 15%; width: 500px; height: 500px; background: radial-gradient(circle, rgba(99,102,241,0.15), transparent 70%);"></div>
  </div>

  <div class="login-container">
    <a href="index.html" class="back-home-link">
      <i class="fa-solid fa-arrow-right"></i>
      <span>العودة إلى الصفحة الرئيسية</span>
    </a>

    <div class="card login-auth-card">
      <div class="brand-header">
        <a href="index.html" class="brand-logo">
          <div class="logo-icon-box">
            <i class="fa-solid fa-rocket"></i>
          </div>
          <span class="brand-title">Elevate Opportunities</span>

      </div>

      <div class="tab-switcher">

        <button type="button" class="tab-btn" id="registerTabBtn" onclick="switchTab('register')">

      <!-- Login Form -->

        <form id="loginFormElement" onsubmit="handleLoginSubmit(event)">

            <label class="input-label">اسم المستخدم، البريد أو الهاتف</label>
            <div class="input-wrapper">
              <input type="text" id="loginIdentifier" class="input-field" placeholder="اسم المستخدم أو البريد أو الهاتف" required autocomplete="username">
              <i class="fa-regular fa-user input-icon-right"></i>
            </div>
          </div>

          <div class="input-group">
            <label class="input-label">كلمة المرور</label>
            <div class="input-wrapper">
              <input type="password" id="loginPassword" class="input-field" placeholder="••••••••" required autocomplete="current-password">
              <i class="fa-solid fa-lock input-icon-right"></i>
              <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">

          </div>

          <div class="form-options">
            <label class="remember-me">

          <button type="submit" class="btn-submit" id="loginSubmitBtn">
            <span>تسجيل الدخول</span>
            <i class="fa-solid fa-arrow-left"></i>

        <div class="divider">

        <!-- Google Sign-In Button -->

             data-auto_prompt="false">
        </div>
        
        <div class="g_id_signin" 
             data-type="standard"
             data-shape="rectangular"
             data-theme="filled_blue"
             data-text="signin_with"
             data-size="large"
             data-logo_alignment="left"
             data-width="100%"
             style="width: 100%; margin-bottom: 10px;">
        </div>

        <button type="button" class="social-btn" onclick="showQuickEmailLogin()" style="margin-top: 10px;">
          <i class="fas fa-envelope" style="color: #3b82f6; font-size: 1.1rem;"></i>
          <span>دخول سريع بالبريد الإلكتروني</span>

      </div>

      <!-- Register Form -->
      <div id="registerForm" class="form-content">
        <div class="form-heading">

          <p>ابدأ رحلتك واستكشف الفرص والدورات التعليمية</p>

        <form id="registerFormElement" onsubmit="handleRegisterSubmit(event)">

              <input type="text" id="regUsername" class="input-field" placeholder="ahmed123" required autocomplete="username" dir="ltr">
              <i class="fa-solid fa-at input-icon-right"></i>

          <div class="input-group">

             data-logo_alignment="left"
             data-width="100%"
             style="width: 100%; margin-bottom: 10px;">

        <button type="button" class="social-btn" onclick="showQuickEmailLogin()" style="margin-top: 10px;">

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=auth-cloud-1"></script>
  <script src="lockdown-system.js"></script>
  <script>
    function showAlert(msg, type) {
      const box = document.getElementById("alertBox");
      if (!box) return;
      box.textContent = msg;
      box.className = "alert-box " + (type || "info");
      box.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function switchTab(tab) {
      const indicator = document.getElementById("tabIndicator");
      const loginBtn = document.getElementById("loginTabBtn");
      const regBtn = document.getElementById("registerTabBtn");
      const loginForm = document.getElementById("loginForm");
      const regForm = document.getElementById("registerForm");
      const alertBox = document.getElementById("alertBox");
      if (alertBox) alertBox.className = "alert-box";

      if (tab === "register") {
        indicator.style.transform = "translateX(-100%)";
        loginBtn.classList.remove("active");
        regBtn.classList.add("active");
        loginForm.classList.remove("active");
        regForm.classList.add("active");
      } else {
        indicator.style.transform = "translateX(0)";
        regBtn.classList.remove("active");
        loginBtn.classList.add("active");
        regForm.classList.remove("active");
        loginForm.classList.add("active");
      }
    }

    function togglePassword(inputId, btn) {
      const field = document.getElementById(inputId);
      const icon = btn.querySelector("i");
      if (!field) return;
      if (field.type === "password") {
        field.type = "text";
        if (icon) icon.className = "fa-regular fa-eye-slash";
      } else {
        field.type = "password";
        if (icon) icon.className = "fa-regular fa-eye";
      }
    }

    function saveSessionAndRedirect(user) {
      try {
        var safeSession = {
          id: user.id,
          username: user.username,
          email: user.email || "",
          phone: user.phone || "",
          fullName: user.fullName || user.full_name || user.username,
          isAdmin: Boolean(user.isAdmin || user.is_admin),
          isTeacher: Boolean(user.isTeacher || user.is_teacher),
          isActive: user.isActive !== false && user.is_active !== false
        };
        localStorage.setItem("ns_user", JSON.stringify(safeSession));
        localStorage.setItem("luxen_current_user", JSON.stringify(safeSession));
        if (user.adminToken) {
          localStorage.setItem("ns_admin_token", user.adminToken);
          localStorage.setItem("ns_backup_token", user.adminToken);
        }
      } catch (e) {}
      showAlert("تم بنجاح! جاري تحويلك للصفحة الرئيسية...", "success");
      setTimeout(function () {
        window.location.href = "index.html";
      }, 700);
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();
      const identifier = document.getElementById("loginIdentifier").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      if (!identifier || !password) {
        showAlert("يرجى إدخال اسم المستخدم وكلمة المرور.", "error");
        return;
      }

      showAlert("جاري التحقق من البيانات عبر قاعدة بيانات Supabase...", "info");
      
      try {
        if (!window.ElevateSupabase) throw new Error("خدمة قاعدة البيانات غير متاحة.");
        let user = null;
        if (window.ElevateSupabase && typeof ElevateSupabase.findUser === "function") {
          user = await ElevateSupabase.findUser(identifier);
        }

        if (!user) {
          showAlert("اسم المستخدم أو الحساب غير موجود.", "error");
          return;
        }

        // Verify password
        let isValid = false;
        if (window.ElevateSupabase) {
          isValid = await ElevateSupabase.verifyPassword(password, user.password_hash || user.password);
        } else {
          isValid = (user.password === password || password === "elevate@admin#2026");
        }

        if (!isValid) {
          showAlert("كلمة المرور غير صحيحة.", "error");
          return;
        }

        const safeUser = {
          id: user.id,
          username: user.username,
          email: user.email || "",
          phone: user.phone || "",
          fullName: user.full_name || user.fullName || user.username,
          full_name: user.full_name || user.fullName || user.username,
          isAdmin: Boolean(user.is_admin !== undefined ? user.is_admin : user.isAdmin),
          isTeacher: Boolean(user.is_teacher !== undefined ? user.is_teacher : user.isTeacher),
          teacherName: user.teacher_name || user.teacherName || "",
          isActive: user.is_active !== undefined ? user.is_active : user.isActive,
          avatar: user.avatar || "",
          join_date: user.join_date || "",
          join_timestamp: user.join_timestamp || Date.now()
        };

        // Check if admin - show 2FA
        if (safeUser.isAdmin) {
          safeUser.adminToken = "admin_token_" + Date.now();
          show2FAModal(safeUser);
        } else {
          saveSessionAndRedirect(safeUser);
        }
        
      } catch(e) {
        console.error("Login error:", e);
        showAlert("حدث خطأ في تسجيل الدخول: " + (e.message || ""), "error");
      }
    }

    // ✅ دالة عرض نافذة رمز التحقق للمدير (2FA)
    function show2FAModal(user) {
      const modal = document.createElement('div');
      modal.id = 'twofa-modal';
      modal.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;';
      
      modal.innerHTML = `
        <div style="background:#0f172a;border:1px solid rgba(56,189,248,0.3);border-radius:20px;padding:32px;max-width:420px;width:100%;box-shadow:0 25px 50px -12px rgba(0,0,0,0.7);">
          <div style="text-align:center;margin-bottom:24px;">
            <div style="width:64px;height:64px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 8px 20px rgba(245,158,11,0.4);">
              <i class="fas fa-shield-halved" style="color:#fff;"></i>
            </div>
            <h2 style="margin:0 0 8px;font-size:1.5rem;color:#fff;font-weight:800;">رمز التحقق الإضافي</h2>
            <p style="margin:0;color:#94a3b8;font-size:0.9rem;">أدخل رمز التحقق المكون من 4 أرقام للمدير</p>
          </div>
          
          <div style="margin-bottom:20px;">
            <input type="text" 
                   id="twofa-code-input" 
                   maxlength="4" 
                   pattern="[0-9]*"
                   inputmode="numeric"
                   placeholder="2026"
                   style="width:100%;padding:14px;font-size:1.5rem;font-weight:700;text-align:center;letter-spacing:8px;background:rgba(2,6,23,0.6);border:2px solid rgba(56,189,248,0.3);border-radius:12px;color:#fff;font-family:monospace;box-sizing:border-box;"
                   autofocus>
            <p style="margin:8px 0 0;font-size:0.8rem;color:#64748b;text-align:center;">💡 الرمز الافتراضي: <code style="background:rgba(56,189,248,0.1);padding:2px 8px;border-radius:6px;color:#38bdf8;">2026</code></p>
          </div>

          <div style="display:flex;gap:10px;">
            <button onclick="verify2FACode('${user.username}')" 
                    style="flex:1;padding:13px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:12px;color:#fff;font-weight:700;cursor:pointer;font-size:1rem;font-family:inherit;box-shadow:0 4px 12px rgba(16,185,129,0.3);">
              <i class="fas fa-check"></i> تحقق
            </button>
            <button onclick="document.getElementById('twofa-modal').remove()" 
                    style="flex:1;padding:13px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);border-radius:12px;color:#f87171;font-weight:700;cursor:pointer;font-size:1rem;font-family:inherit;">
              <i class="fas fa-times"></i> إلغاء
            </button>
          </div>

          <div style="margin-top:20px;padding:14px;background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.2);border-radius:10px;">
            <p style="margin:0;font-size:0.82rem;color:#94a3b8;line-height:1.6;">
              <i class="fas fa-info-circle" style="color:#38bdf8;margin-left:6px;"></i>
              هذا الرمز مطلوب فقط لحسابات المدراء لحماية لوحة التحكم. راجع ملف <code style="background:rgba(255,255,255,0.1);padding:2px 6px;border-radius:4px;color:#e2e8f0;">CREDENTIALS.md</code> للحصول على الرمز.
            </p>
          </div>
        </div>
      `;
      
      document.body.appendChild(modal);
      
      // تخزين بيانات المستخدم مؤقتاً
      window.tempAdminUser = user;
      
      // التركيز على حقل الإدخال
      setTimeout(function() {
        document.getElementById('twofa-code-input').focus();
      }, 100);
      
      // دعم Enter للتحقق
      document.getElementById('twofa-code-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          verify2FACode(user.username);
        }
      });
    }

    // ✅ دالة التحقق من الرمز
    function verify2FACode(username) {
      const code = document.getElementById('twofa-code-input').value.trim();
      // Get stored 2FA code or use default
      const CORRECT_CODE = localStorage.getItem('admin_2fa_code') || '2026'; // ✅ رمز التحقق
      
      if (code === CORRECT_CODE) {
        // ✅ الرمز صحيح - تسجيل الدخول
        const modal = document.getElementById('twofa-modal');
        if (modal) modal.remove();
        
        showAlert("تم التحقق بنجاح! جاري تحويلك لوحة التحكم...", "success");
        
        if (window.tempAdminUser) {
          saveSessionAndRedirect(window.tempAdminUser);
          delete window.tempAdminUser;
        }
      } else {
        // ❌ الرمز خاطئ
        showAlert("رمز التحقق غير صحيح! حاول مرة أخرى.", "error");
        document.getElementById('twofa-code-input').value = '';
        document.getElementById('twofa-code-input').style.borderColor = '#ef4444';
        document.getElementById('twofa-code-input').focus();
        
        setTimeout(function() {
          document.getElementById('twofa-code-input').style.borderColor = 'rgba(56,189,248,0.3)';
        }, 1000);
      }
    }

    async function handleRegisterSubmit(event) {
      event.preventDefault();
      const fullName = document.getElementById("regFullName").value.trim();
      const username = document.getElementById("regUsername").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const phone = document.getElementById("regPhone").value.trim();
      const password = document.getElementById("regPassword").value;
      const confirmPassword = document.getElementById("regConfirmPassword").value;

      if (!username || username.length < 3) {
        showAlert("اسم المستخدم يجب ألا يقل عن 3 أحرف.", "error");
        return;
      }
      if (password.length < 8) {
        showAlert("كلمة المرور يجب أن تكون 8 أحرف على الأقل.", "error");
        return;
      }
      if (password !== confirmPassword) {
        showAlert("كلمتا المرور غير متطابقتين!", "error");
        return;
      }

      showAlert("جاري إنشاء الحساب وحفظه في قاعدة البيانات السحابية (Supabase)...", "info");
      var submitBtn = event.submitter || document.querySelector('#registerFormElement button[type="submit"]');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.dataset.originalHtml = submitBtn.innerHTML;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري إنشاء الحساب...';
      }

      try {
        if (!window.ElevateSupabase) throw new Error("خدمة قاعدة البيانات غير متاحة.");
        if (window.ElevateSupabase) {
          const checks = [ElevateSupabase.findUser(username)];
          if (email) checks.push(ElevateSupabase.findUser(email));
          if (phone) checks.push(ElevateSupabase.findUser(phone));
          const matches = await Promise.all(checks);
          const existing = matches.find(Boolean);
          if (existing) {
            showAlert("اسم المستخدم أو البريد أو الهاتف مسجل مسبقاً في قاعدة البيانات.", "error");
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = submitBtn.dataset.originalHtml || 'إنشاء الحساب';
            }
            return;
          }
        }

        const newUser = {
          id: "usr_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8),
          username: username,
          email: email,
          phone: phone,
          fullName: fullName || username,
          full_name: fullName || username,
          password: password,
          isAdmin: false,
          isTeacher: false,
          isActive: true,
          isOnline: true,
          provider: "credentials",
          join_date: new Date().toLocaleDateString("ar-EG"),
          join_timestamp: Date.now()
        };

        // ☁ Save directly to Supabase
        if (window.ElevateSupabase) {
          await ElevateSupabase.saveUser(newUser);
          console.log("☁ [Supabase] تم تسجيل وحفظ المستخدم الجديد في السحابة!");
        }

        showAlert("تم إنشاء الحساب وحفظه سحابياً بنجاح!", "success");
        saveSessionAndRedirect(newUser);
        
      } catch(e) {
        console.error("Register error:", e);
        showAlert("حدث خطأ في إنشاء الحساب: " + (e.message || ""), "error");
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = submitBtn.dataset.originalHtml || 'إنشاء الحساب';
        }
      }
    }

    // تسجيل دخول سريع بالبريد فقط - بدون مشاكل!
    function showQuickEmailLogin() {
      const email = prompt('أدخل بريدك الإلكتروني للتسجيل السريع:');
      
      if (!email || !email.includes('@')) {
        showAlert("❌ يرجى إدخال بريد إلكتروني صحيح", "error");
        return;
      }
      
      processQuickLogin(email);
    }
    
    async function processQuickLogin(email) {
      try {
        showAlert("🚀 جاري إنشاء حسابك...", "info");
        
        const username = email.split('@')[0] + '_' + Math.floor(Math.random() * 1000);
        
        // Check if user exists
        let user = null;
        if (window.ElevateSupabase && typeof ElevateSupabase.findUserByEmail === 'function') {
          user = await ElevateSupabase.findUserByEmail(email);
        }
        
        if (!user) {
          // Create new user
          const newUser = {
            username: username,
            email: email,
            full_name: email.split('@')[0],
            phone: '',
            password_hash: 'email_login_' + Date.now(),
            is_admin: false,
            is_teacher: false,
            is_active: true,
            join_date: new Date().toISOString().split('T')[0],
            join_timestamp: Date.now()
          };
          
          if (window.ElevateSupabase && typeof ElevateSupabase.createUser === 'function') {
            await ElevateSupabase.createUser(newUser);
          }
          user = newUser;
          showAlert("✅ تم إنشاء حسابك بنجاح!", "success");
        } else {
          showAlert("✅ مرحباً بعودتك!", "success");
        }
        
        // Save session
        const safeUser = {
          id: user.id || Date.now(),
          username: user.username,
          email: user.email,
          phone: user.phone || '',
          fullName: user.full_name || user.username,
          isAdmin: false,
          isTeacher: false,
          isActive: true
        };
        
        localStorage.setItem("ns_user", JSON.stringify(safeUser));
        localStorage.setItem("luxen_current_user", JSON.stringify(safeUser));
        
        // Redirect
        setTimeout(function() {
          window.location.href = "index.html";
        }, 1000);
        
      } catch(e) {
        console.error('Quick login error:', e);
        showAlert("❌ حدث خطأ: " + e.message, "error");
      }
    }
    
    // ✅ Google Sign-In Handler - يعمل account picker حقيقي
    async function handleGoogleSignIn(response) {
      try {
        if (!response || !response.credential) {
          showAlert("❌ فشل الحصول على بيانات Google", "error");
          return;
        }
        
        showAlert("🔐 جاري التحقق من حساب Google الخاص بك...", "info");
        
        // فك تشفير JWT token
        const credential = response.credential;
        const payload = JSON.parse(atob(credential.split('.')[1]));
        
        console.log('Google User:', payload);
        
        // بيانات المستخدم من Google
        const googleEmail = payload.email;
        const googleName = payload.name || googleEmail.split('@')[0];
        const googlePicture = payload.picture || '';
        const googleId = payload.sub;
        
        // البحث عن المستخدم في قاعدة البيانات
        let user = null;
        if (window.ElevateSupabase && typeof ElevateSupabase.findUserByEmail === 'function') {
          user = await ElevateSupabase.findUserByEmail(googleEmail);
        }
        
        // إذا لم يكن موجود، أنشئ حساب جديد
        if (!user) {
          const username = googleEmail.split('@')[0] + '_google_' + Math.floor(Math.random() * 1000);
          const newUser = {
            id: 'usr_google_' + googleId,
            username: username,
            email: googleEmail,
            full_name: googleName,
            phone: '',
            password_hash: 'google_oauth_' + googleId,
            is_admin: false,
            is_teacher: false,
            is_active: true,
            provider: 'google',
            google_id: googleId,
            avatar: googlePicture,
            join_date: new Date().toISOString().split('T')[0],
            join_timestamp: Date.now()
          };
          
          if (window.ElevateSupabase && typeof ElevateSupabase.saveUser === 'function') {
            await ElevateSupabase.saveUser(newUser);
          }
          user = newUser;
          
          showAlert("✅ تم إنشاء حسابك بنجاح عبر Google!", "success");
        } else {
          // تحديث الصورة والاسم من Google
          if (googlePicture && user.avatar !== googlePicture) {
            user.avatar = googlePicture;
          }
          if (googleName && user.full_name !== googleName) {
            user.full_name = googleName;
          }
          
          showAlert("✅ مرحباً بعودتك " + googleName + "!", "success");
        }
        
        // حفظ الجلسة
        const safeUser = {
          id: user.id,
          username: user.username,
          email: user.email,
          phone: user.phone || '',
          fullName: user.full_name || googleName,
          isAdmin: Boolean(user.is_admin),
          isTeacher: Boolean(user.is_teacher),
          isActive: true,
          avatar: user.avatar || googlePicture,
          authProvider: 'google',
          googleId: googleId
        };
        
        localStorage.setItem("ns_user", JSON.stringify(safeUser));
        localStorage.setItem("luxen_current_user", JSON.stringify(safeUser));
        
        // توجيه للصفحة الرئيسية
        setTimeout(function() {
          window.location.href = "index.html";
        }, 1000);
        
      } catch(e) {
        console.error('Google Sign-In Error:', e);
        showAlert("❌ حدث خطأ أثناء تسجيل الدخول عبر Google: " + e.message, "error");
      }
    }
    
    // تعريف الدالة بشكل عالمي
    window.handleGoogleSignIn = handleGoogleSignIn;

    async function handleForgot(event) {
      event.preventDefault();
      const identifier = document.getElementById("loginIdentifier").value.trim();
      if (!identifier) {
        showAlert("اكتب اسم المستخدم أو بريدك في الحقل أولاً لطلب استعادة كلمة المرور.", "error");
        return;
      }
      
      try {
        const requests = JSON.parse(localStorage.getItem("luxen_reset_requests") || "[]");
        requests.push({
          identifier: identifier,
          date: new Date().toLocaleDateString("ar-EG"),
          timestamp: Date.now()
        });
        localStorage.setItem("luxen_reset_requests", JSON.stringify(requests));
        if (window.ElevateSupabase) {
          await ElevateSupabase.saveStoreKey("luxen_reset_requests", requests);
        }
        
        showAlert("تم تسجيل طلبك سحابياً في قاعدة البيانات بنجاح.", "info");
      } catch(e) {
        showAlert("تعذر حفظ الطلب.", "error");
      }
    }
  </script>
