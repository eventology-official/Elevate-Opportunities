<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة البيانات - Elevate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 2rem;
            text-align: center;
        }
        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 16px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-secondary {
            background: rgba(71, 85, 105, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        .status {
            background: rgba(30, 41, 59, 0.6);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status h3 {
            color: #60a5fa;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        .status p {
            color: rgba(255, 255, 255, 0.8);
            margin: 8px 0;
            line-height: 1.6;
        }
        .alert {
            padding: 16px;
            border-radius: 12px;
            margin: 15px 0;
            font-weight: 500;
        }
        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            border: 2px solid #10b981;
            color: #6ee7b7;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            color: #fca5a5;
        }
        .alert-warning {
            background: rgba(245, 158, 11, 0.2);
            border: 2px solid #f59e0b;
            color: #fcd34d;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.7);
        }
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #60a5fa;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 استعادة البيانات</h1>
        <p class="subtitle">استرجع بياناتك من السحابة أو أضف بيانات تجريبية</p>
        
        <div id="status"></div>
        
        <div class="btn-group">
            <button class="btn" onclick="syncFromSupabase()">
                <span>☁️</span>
                <span>استرجاع البيانات من Supabase</span>
            </button>
            
            <button class="btn btn-success" onclick="addSampleData()">
                <span>➕</span>
                <span>إضافة بيانات تجريبية كاملة (100+ فرصة)</span>
            </button>
            
            <button class="btn btn-secondary" onclick="checkCurrentData()">
                <span>🔍</span>
                <span>فحص البيانات الحالية</span>
            </button>
            
            <button class="btn btn-secondary" onclick="location.href='check-cards.html'">
                <span>📊</span>
                <span>صفحة الفحص التفصيلية</span>
            </button>
            
            <button class="btn btn-secondary" onclick="location.href='index.html'">
                <span>🏠</span>
                <span>العودة للموقع</span>
            </button>
        </div>
        
        <a href="?view=admin" class="back-link">🔐 الذهاب إلى لوحة المدير</a>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script>
        const statusDiv = document.getElementById('status');
        
        function showStatus(message, type = 'info') {
            const className = type === 'success' ? 'alert-success' : 
                            type === 'error' ? 'alert-error' : 
                            type === 'warning' ? 'alert-warning' : '';
            statusDiv.innerHTML = `<div class="alert ${className}">${message}</div>`;
        }
        
        function showLoading(message) {
            statusDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 10px;">${message}</p>
                </div>
            `;
        }
        
        async function syncFromSupabase() {
            showLoading('جاري الاتصال بـ Supabase...');
            
            try {
                // Direct REST API call to Supabase
                const SUPABASE_URL = 'https://uhjstvlhlkcewmquhrnj.supabase.co';
                const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoanN0dmxobGtjZXdtcXVocm5qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzNzU3MDUsImV4cCI6MjExMDk1MTcwNX0.XpTZ-mxoY89WDcQ4dYzubev65hcxFOJ67iK7ikoVNuA';
                
                const headers = {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json'
                };
                
                // 1. Fetch Store Data (cards, partners, etc.)
                showLoading('جاري استرجاع البيانات... (1/2)');
                const storeResponse = await fetch(SUPABASE_URL + '/rest/v1/site_store?select=*', {
                    headers: headers
                });
                
                if (!storeResponse.ok) {
                    throw new Error('فشل الاتصال بـ Supabase: ' + storeResponse.status);
                }
                
                const storeData = await storeResponse.json();
                console.log('Store data:', storeData);
                
                // Save to localStorage
                if (Array.isArray(storeData)) {
                    storeData.forEach(item => {
                        if (item.key && item.value) {
                            const value = typeof item.value === 'string' ? item.value : JSON.stringify(item.value);
                            localStorage.setItem(item.key, value);
                        }
                    });
                }
                
                // 2. Fetch Users
                showLoading('جاري استرجاع المستخدمين... (2/2)');
                const usersResponse = await fetch(SUPABASE_URL + '/rest/v1/users?select=*', {
                    headers: headers
                });
                
                if (usersResponse.ok) {
                    const usersData = await usersResponse.json();
                    console.log('Users data:', usersData);
                    
                    if (Array.isArray(usersData)) {
                        const mappedUsers = usersData.map(u => ({
                            id: u.id,
                            username: u.username,
                            email: u.email || '',
                            phone: u.phone || '',
                            fullName: u.full_name || u.username,
                            full_name: u.full_name || u.username,
                            password_hash: u.password_hash || '',
                            passwordHash: u.password_hash || '',
                            isAdmin: Boolean(u.is_admin),
                            isTeacher: Boolean(u.is_teacher),
                            isActive: Boolean(u.is_active),
                            provider: u.provider || 'credentials',
                            avatar: u.avatar || '',
                            join_date: u.join_date || '',
                            last_login: u.last_login || Date.now()
                        }));
                        localStorage.setItem('luxen_all_users', JSON.stringify(mappedUsers));
                    }
                }
                
                // Check results
                const cards = JSON.parse(localStorage.getItem('luxen_general_cards') || '[]');
                const users = JSON.parse(localStorage.getItem('luxen_all_users') || '[]');
                const partners = JSON.parse(localStorage.getItem('luxen_partners') || '[]');
                
                showStatus(`
                    <h3>✅ تم الاسترجاع بنجاح من Supabase!</h3>
                    <p>📦 عدد الفرص: <strong>${cards.length}</strong></p>
                    <p>🤝 عدد الشركاء: <strong>${partners.length}</strong></p>
                    <p>👥 عدد المستخدمين: <strong>${users.length}</strong></p>
                    <p style="margin-top: 20px;">
                        <a href="index.html" style="color: #60a5fa; font-weight: bold; font-size: 1.1rem;">
                            👉 ارجع للموقع الآن!
                        </a>
                    </p>
                `, 'success');
                
            } catch (error) {
                console.error('Supabase sync error:', error);
                showStatus(`
                    <h3>❌ فشل الاسترجاع من Supabase</h3>
                    <p><strong>الخطأ:</strong> ${error.message}</p>
                    <p style="margin-top: 15px;">جرب "إضافة بيانات تجريبية" بدلاً من ذلك، أو تحقق من اتصال الإنترنت.</p>
                `, 'error');
            }
        }
        
        function addSampleData() {
            showLoading('جاري إضافة البيانات التجريبية...');
            
            const categories = [
                { type: 'competitions', name: 'مسابقة', category: 'مسابقات' },
                { type: 'scholarships', name: 'منحة', category: 'منح دراسية' },
                { type: 'volunteering', name: 'فرصة تطوع', category: 'تطوع' },
                { type: 'jobs', name: 'وظيفة', category: 'وظائف' },
                { type: 'events', name: 'فعالية', category: 'فعاليات' },
                { type: 'courses', name: 'كورس', category: 'كورسات' },
                { type: 'workshops', name: 'ورشة', category: 'ورش عمل' },
                { type: 'travel', name: 'سفر ممول', category: 'سفر' }
            ];
            
            const companies = ['Google', 'Microsoft', 'Harvard', 'MIT', 'UNESCO', 'Red Cross', 'Amazon', 'Meta'];
            
            const sampleCards = [];
            let baseTime = Date.now();
            
            // Add 15 opportunities per category
            categories.forEach((cat, catIndex) => {
                for (let i = 0; i < 15; i++) {
                    const id = `sample_${cat.type}_${baseTime + catIndex * 1000 + i}`;
                    sampleCards.push({
                        id: id,
                        numId: baseTime + catIndex * 1000 + i,
                        name: `${cat.name} تجريبية ${i + 1} - ${companies[Math.floor(Math.random() * companies.length)]}`,
                        type: cat.type,
                        category: companies[Math.floor(Math.random() * companies.length)],
                        tags: `${cat.category} تجريبي اختبار`,
                        description: `هذه فرصة تجريبية من نوع ${cat.name} تم إنشاؤها للاختبار. تحتوي على جميع الخصائص الأساسية المطلوبة.`,
                        shortDesc: `${cat.name} تجريبية للاختبار`,
                        deadline: new Date(Date.now() + (30 + i) * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                        status: 'visible',
                        link: 'https://example.com',
                        createdAt: baseTime + i * 1000,
                        isFeatured: i % 5 === 0
                    });
                }
            });
            
            // Save to localStorage
            localStorage.setItem('luxen_general_cards', JSON.stringify(sampleCards));
            
            // Add sample partners
            const samplePartners = [
                { id: 'p1', name: 'Google', type: 'شريك تقني', logo: 'images/logo.png', btnEnabled: true, socials: [] },
                { id: 'p2', name: 'Microsoft', type: 'شريك استراتيجي', logo: 'images/logo.png', btnEnabled: true, socials: [] },
                { id: 'p3', name: 'Harvard University', type: 'مؤسسة تعليمية', logo: 'images/logo.png', btnEnabled: true, socials: [] }
            ];
            localStorage.setItem('luxen_partners', JSON.stringify(samplePartners));
            
            setTimeout(() => {
                showStatus(`
                    <h3>✅ تم إضافة البيانات بنجاح!</h3>
                    <p>📦 تم إضافة ${sampleCards.length} فرصة</p>
                    <p>🤝 تم إضافة ${samplePartners.length} شريك</p>
                    <p><strong>ارجع للموقع الآن!</strong></p>
                    <p style="margin-top: 15px;">
                        <a href="index.html?category=competitions" style="color: #60a5fa; font-weight: bold;">
                            👉 اذهب للمسابقات
                        </a>
                    </p>
                `, 'success');
            }, 1000);
        }
        
        function checkCurrentData() {
            const cards = JSON.parse(localStorage.getItem('luxen_general_cards') || '[]');
            const partners = JSON.parse(localStorage.getItem('luxen_partners') || '[]');
            const users = JSON.parse(localStorage.getItem('luxen_all_users') || '[]');
            
            if (cards.length === 0) {
                showStatus(`
                    <h3>⚠️ لا توجد بيانات</h3>
                    <p>localStorage فارغ!</p>
                    <p><strong>الحل:</strong> اضغط على "إضافة بيانات تجريبية" أو "استرجاع من Supabase".</p>
                `, 'warning');
            } else {
                const byType = {};
                cards.forEach(card => {
                    byType[card.type] = (byType[card.type] || 0) + 1;
                });
                
                showStatus(`
                    <h3>✅ البيانات موجودة</h3>
                    <p>📦 عدد الفرص: ${cards.length}</p>
                    <p>🤝 عدد الشركاء: ${partners.length}</p>
                    <p>👥 عدد المستخدمين: ${users.length}</p>
                    <p><strong>حسب التصنيف:</strong></p>
                    <p style="font-size: 0.9rem;">${Object.entries(byType).map(([type, count]) => `${type}: ${count}`).join(' | ')}</p>
                `, 'success');
            }
        }
        
        // Auto check on load
        window.onload = checkCurrentData;
    </script>
</body>
</html>
