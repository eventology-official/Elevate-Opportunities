<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Opportunities</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #0f172a;
            color: #fff;
        }
        .card {
            background: #1e293b;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        button {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        pre {
            background: #000;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔍 اختبار الفرص في LocalStorage</h1>
    
    <div>
        <button onclick="checkOpportunities()">فحص الفرص</button>
        <button onclick="addTestOpportunity()">إضافة فرصة تجريبية</button>
        <button onclick="clearAll()">مسح الكل</button>
    </div>
    
    <div id="result"></div>
    
    <script>
        function checkOpportunities() {
            const cards = localStorage.getItem('luxen_general_cards');
            const result = document.getElementById('result');
            
            if (!cards) {
                result.innerHTML = '<div class="card"><h3>❌ لا توجد فرص</h3><p>LocalStorage فاضي</p></div>';
                return;
            }
            
            try {
                const opportunities = JSON.parse(cards);
                result.innerHTML = `
                    <div class="card">
                        <h3>✅ تم العثور على ${opportunities.length} فرصة</h3>
                        <pre>${JSON.stringify(opportunities, null, 2)}</pre>
                    </div>
                `;
            } catch (e) {
                result.innerHTML = `<div class="card"><h3>❌ خطأ</h3><p>${e.message}</p></div>`;
            }
        }
        
        function addTestOpportunity() {
            const testOpp = {
                id: "test_" + Date.now(),
                numId: Date.now(),
                name: "فرصة تجريبية للاختبار",
                type: "competitions",
                category: "competitions",
                tags: "اختبار، تجريبي",
                desc: "هذه فرصة تجريبية للاختبار فقط",
                shortDesc: "فرصة تجريبية",
                deadline: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                status: "visible",
                link: "#",
                createdAt: Date.now()
            };
            
            let cards = [];
            const existing = localStorage.getItem('luxen_general_cards');
            if (existing) {
                try {
                    cards = JSON.parse(existing);
                } catch (e) {
                    cards = [];
                }
            }
            
            cards.push(testOpp);
            localStorage.setItem('luxen_general_cards', JSON.stringify(cards));
            
            alert('✅ تم إضافة فرصة تجريبية!');
            checkOpportunities();
        }
        
        function clearAll() {
            if (confirm('هل أنت متأكد من مسح كل الفرص؟')) {
                localStorage.removeItem('luxen_general_cards');
                alert('✅ تم المسح');
                document.getElementById('result').innerHTML = '';
            }
        }
        
        // Auto check on load
        window.onload = checkOpportunities;
    </script>
</body>
</html>
