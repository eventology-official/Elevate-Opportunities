<!DOCTYPE html>
<html>
<head>
  <title>اختبار صفحة الإعدادات</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    .test-box {
      background: #2a2a2a;
      padding: 20px;
      margin: 10px 0;
      border-radius: 10px;
      border: 2px solid #4a4a4a;
    }
    .success { border-color: #10b981; }
    .error { border-color: #ef4444; }
    button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-test { background: #3b82f6; color: white; }
  </style>
</head>
<body>
  <h1>🧪 اختبار صفحة الإعدادات</h1>
  
  <div class="test-box">
    <h3>1️⃣ التحقق من وجود القسم</h3>
    <button class="btn-test" onclick="test1()">اختبار</button>
    <div id="result1"></div>
  </div>

  <div class="test-box">
    <h3>2️⃣ التحقق من وجود الزر</h3>
    <button class="btn-test" onclick="test2()">اختبار</button>
    <div id="result2"></div>
  </div>

  <div class="test-box">
    <h3>3️⃣ محاولة فتح القسم</h3>
    <button class="btn-test" onclick="test3()">فتح index.html مع الإعدادات</button>
    <div id="result3"></div>
  </div>

  <script>
    function test1() {
      window.open('index.html', '_blank');
      document.getElementById('result1').innerHTML = `
        <p style="color: #10b981;">✅ تم فتح الموقع في تبويب جديد</p>
        <p>بعد تسجيل الدخول، ابحث عن زر "الإعدادات والأمان" في قائمة لوحة التحكم</p>
      `;
    }

    function test2() {
      fetch('index.html')
        .then(r => r.text())
        .then(html => {
          const hasButton = html.includes('data-sec="adm-sec-settings"');
          const hasSection = html.includes('id="adm-sec-settings"');
          
          let result = '<p style="color: #10b981;">✅ الزر موجود: ' + (hasButton ? 'نعم' : 'لا') + '</p>';
          result += '<p style="color: #10b981;">✅ القسم موجود: ' + (hasSection ? 'نعم' : 'لا') + '</p>';
          
          if (hasButton && hasSection) {
            result += '<p style="color: #fbbf24;">⚠️ كل شيء موجود! المشكلة قد تكون في Cache المتصفح</p>';
            result += '<p>جرب: Ctrl+Shift+Delete لمسح الـ Cache</p>';
          }
          
          document.getElementById('result2').innerHTML = result;
        });
    }

    function test3() {
      document.getElementById('result3').innerHTML = `
        <p style="color: #38bdf8;">📋 خطوات الاختبار:</p>
        <ol style="line-height: 2;">
          <li>اضغط Ctrl+Shift+Delete</li>
          <li>امسح Cached images and files</li>
          <li>أغلق المتصفح تماماً</li>
          <li>افتح index.html من جديد</li>
          <li>سجل دخول كمدير</li>
          <li>ابحث عن "الإعدادات والأمان" في القائمة</li>
        </ol>
      `;
    }
  </script>
</body>
</html>
